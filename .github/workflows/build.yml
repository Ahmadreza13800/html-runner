name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate Fresh Project Scaffolding
        run: |
          # ذخیره فایل‌های اصلی در یک پوشه موقت تا خراب نشوند
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/
          cp -r lib /tmp/backup/

          # ساخت تمیز ساختار اندروید
          flutter create . --platforms=android --org com.example.htmlrunner --project-name html_runner

          # برگرداندن فایل‌های اصلی
          cp /tmp/backup/pubspec.yaml ./pubspec.yaml
          cp -r /tmp/backup/lib ./

      - name: Configure Android Gradle & Permissions
        run: |
          # اضافه کردن مجوز دسترسی به اینترنت
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # ست کردن minSdkVersion روی 21 که WebView نیاز دارد
          sed -i 's/minSdkVersion.*/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk =.*/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/compileSdk =.*/compileSdk = 34/g' android/app/build.gradle || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
